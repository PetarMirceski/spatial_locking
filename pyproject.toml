[project]
name = "spatial_locking"
version = "0.1.0"
description = ""
authors = [{ name = "Petar Mirceski", email = "petar.mirceski1998@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numba>=0.60.0,<0.61",
    "natsort>=8.4.0,<9",
    "numpy>=2.0.1,<3",
    "matplotlib>=3.9.1,<4",
    "tqdm>=4.66.4,<5",
    "scipy>=1.14.0,<2",
    "jupyterlab>=4.2.4,<5",
    "ipympl>=0.9.4,<0.10",
    "scikit-image>=0.24.0,<0.25",
]

[dependency-groups]
dev = [
    "pre-commit>=3.7.1,<4",
]

[tool.uv]
package = false

# matplotlib axes __get__ item error ignore for the project
[tool.pyright]
reportIndexIssue = false
